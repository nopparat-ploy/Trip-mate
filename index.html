<title>Tripmate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed trip photo behind everything, frosted-glass panels float on top (photo-first, like a travel magazine cover). Deliberately single dark look. */
:root{
  --ink:#0c1310;
  --glass:rgba(12,19,16,.46);
  --glass-strong:rgba(12,19,16,.72);
  --glass-soft:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.16);
  --line-strong:rgba(255,255,255,.34);
  --text:#f4f2ea;
  --muted:rgba(244,242,234,.68);
  --faint:rgba(244,242,234,.42);
  --sun:#f2b33d;
  --sun-ink:#2a1d04;
  --moss:#a6c96a;
  --good:#7fd6a0;
  --warn:#f2b33d;
  --bad:#ff8a7a;
  --f-display:"Bebas Neue","Kanit",Impact,sans-serif;
  --f-head:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Kanit",system-ui,sans-serif;
  --r:16px;
  --ease:cubic-bezier(.77,0,.18,1);
  --spring:cubic-bezier(.2,.9,.25,1.15);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- background ---------- */
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--ink)}
#bg .layer{position:absolute;inset:-30px;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease, filter .6s ease;transform:scale(1.04);animation:drift 40s ease-in-out infinite alternate}
#bg .layer.on{opacity:1}
@keyframes drift{from{transform:scale(1.04) translate3d(0,0,0)}to{transform:scale(1.12) translate3d(-1.5%,-1%,0)}}
#veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  linear-gradient(90deg,rgba(6,10,8,var(--dimL,.72)) 0%,rgba(6,10,8,var(--dimR,.35)) 60%,rgba(6,10,8,var(--dimR,.35)) 100%),
  linear-gradient(0deg,rgba(6,10,8,.85) 0%,rgba(6,10,8,0) 40%)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:20px;padding:16px clamp(16px,4vw,48px);transition:background .4s}
.top.scrolled{background:rgba(8,13,11,.6);backdrop-filter:blur(16px)}
.logo{display:flex;align-items:center;gap:10px;font:600 13px/1 var(--f-head);letter-spacing:.32em;text-transform:uppercase;white-space:nowrap;background:none;border:0;padding:0}
.logo svg{width:26px;height:26px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{background:none;border:0;padding:8px 10px;font:500 12.5px/1 var(--f-head);letter-spacing:.06em;color:var(--muted);position:relative;transition:color .25s}
.nav button::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--sun);transform:scaleX(0);transition:transform .45s var(--ease);transform-origin:left}
.nav button:hover{color:var(--text)}
.nav button.on{color:var(--text)}
.nav button.on::after{transform:scaleX(1)}
.tools{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass-soft);border:1px solid var(--line);transition:background .25s,transform .25s var(--spring)}
.icon-btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.icon-btn svg{width:17px;height:17px}
.trip-chip{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:999px;background:var(--glass-soft);border:1px solid var(--line);max-width:220px}
.trip-chip .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:500 13px var(--f-head)}
.trip-chip .thumb{width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;flex:none}

svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.save-chip{height:30px;font-size:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:background .3s,color .3s}
.save-chip.saving{color:var(--muted)}
.save-chip.saving i{width:8px;height:8px;border-radius:50%;background:var(--sun);animation:blink 1s infinite}
.save-chip.saved{color:var(--good)}
.save-chip.fail{color:var(--bad);background:rgba(255,138,122,.14)}
@keyframes blink{50%{opacity:.25}}
@media (max-width:560px){.save-chip span{display:none}.save-chip{padding:0 9px}}
.loader{display:grid;place-items:center;gap:16px;min-height:60vh;text-align:center;color:var(--muted)}
.loader .spin{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sun);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- dock (mobile) ---------- */
.dock{display:none}
@media (max-width:1080px){
  .nav{display:none}
  .tools{margin-left:auto}
  .dock{display:flex;position:fixed;z-index:45;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);gap:2px;padding:6px;border-radius:999px;background:rgba(250,248,240,.95);color:#15201a;box-shadow:0 18px 40px rgba(0,0,0,.4);max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
  .dock button{display:grid;place-items:center;gap:1px;min-width:48px;height:48px;border-radius:999px;border:0;background:none;color:#15201a;font:500 9.5px/1 var(--f-head);padding:4px 8px;transition:background .3s}
  .dock button svg{width:19px;height:19px}
  .dock button.on{background:#15201a;color:#f6f3ea}
  main{padding-bottom:110px!important}
}
@media (max-width:560px){ .trip-chip .tn{display:none} .trip-chip{padding:0 6px} .logo span{display:none} }

/* ---------- main & generic ---------- */
main{padding:8px clamp(16px,4vw,48px) 60px;max-width:1440px;margin:0 auto}
.view>*{animation:rise .75s var(--ease) both}
.view>*:nth-child(2){animation-delay:.08s}.view>*:nth-child(3){animation-delay:.16s}.view>*:nth-child(4){animation-delay:.24s}.view>*:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--line);border-radius:var(--r)}
.panel{padding:22px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.panel-h h3{margin:0;font:600 18px/1.2 var(--f-head)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:18px 0 22px}
.page-h h1{margin:0;font:400 clamp(44px,7vw,84px)/.9 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.page-h h1 small{display:block;font:500 15px/1.4 var(--f-head);letter-spacing:.02em;color:var(--muted);margin-bottom:10px}
.eyebrow{display:flex;align-items:center;gap:10px;font:500 13px/1 var(--f-head);color:var(--muted);letter-spacing:.04em}
.dash{width:22px;height:3px;background:var(--text);display:inline-block}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;font:500 13.5px/1 var(--f-head);letter-spacing:.03em;transition:background .3s,transform .3s var(--spring),border-color .3s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.sun:hover{background:#ffc552}
.btn.light{background:var(--text);border-color:var(--text);color:#16201b}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px}
.btn.danger{border-color:rgba(255,138,122,.5);color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.fab{width:50px;height:50px;border-radius:50%;border:0;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;position:relative;overflow:hidden;transition:transform .35s var(--spring);box-shadow:0 10px 30px rgba(242,179,61,.35)}
.fab:hover{transform:scale(1.08)}
.fab svg{width:20px;height:20px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .65s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.link{background:none;border:0;padding:0;color:var(--sun);font:500 13px var(--f-head)}
.ib{width:32px;height:32px;border-radius:50%;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.ib:hover{background:rgba(255,255,255,.1);color:var(--text)}
.ib svg{width:15px;height:15px}

.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:500 12px/1 var(--f-head);background:rgba(255,255,255,.1);white-space:nowrap}
.chip.good{background:rgba(127,214,160,.16);color:var(--good)}
.chip.warn{background:rgba(242,179,61,.16);color:var(--warn)}
.chip.bad{background:rgba(255,138,122,.15);color:var(--bad)}
.chip.sun{background:var(--sun);color:var(--sun-ink)}
.chip svg{width:13px;height:13px}

/* segmented pill (from the "Choose a destination" reference) */
.seg{display:flex;border:1.5px solid var(--line-strong);border-radius:999px;padding:3px;position:relative;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg button,.seg label{position:relative;z-index:1;flex:1 0 auto;border:0;background:none;padding:8px 18px;border-radius:999px;font:500 13.5px/1 var(--f-head);color:var(--muted);transition:color .35s;white-space:nowrap;text-align:center;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg .on,.seg label:has(input:checked){color:var(--text);background:rgba(255,255,255,.18);font-weight:600}
.seg button,.seg label{transition:color .35s,background .45s var(--ease)}

/* forms */
.field{display:grid;gap:6px;min-width:0}
.field>span{font:500 12.5px var(--f-head);color:var(--muted);letter-spacing:.02em}
.in{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);transition:border-color .25s,background .25s}
textarea.in{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.in:focus{outline:none;border-color:var(--sun);background:rgba(255,255,255,.1)}
select.in option{background:#1a231e;color:var(--text)}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}

/* avatars */
.av{--c:#888;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#121a15;font:600 14px/1 var(--f-head);flex:none;border:2px solid rgba(12,19,16,.6);position:relative}
.av.lg{width:52px;height:52px;font-size:20px}
.av.sm{width:26px;height:26px;font-size:11px}
.av .crown{position:absolute;top:-11px;left:50%;transform:translateX(-50%);color:var(--sun);width:16px;height:16px}
.stack{display:flex}.stack .av{margin-left:-8px}.stack .av:first-child{margin-left:0}

/* ---------- dashboard hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,56px);align-items:end;min-height:min(560px,70vh);padding:3vh 0 10px}
.hero-copy .eyebrow{font-size:17px;color:var(--text);margin:14px 0 6px;letter-spacing:.01em;font-weight:400}
.hero-title{margin:0;overflow-wrap:anywhere;font:400 clamp(56px,7.6vw,120px)/.86 var(--f-display);letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
.hero-title .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-top:.06em}
.hero-title .w>span{display:inline-block;animation:wordUp 1s var(--ease) both}
@keyframes wordUp{from{transform:translateY(105%)}to{transform:none}}
.hero-meta{margin:16px 0 22px;color:var(--muted);max-width:42ch;font-size:14px}
.hero-meta b{color:var(--text);font-weight:500}
.rail{position:relative;min-width:0}
.rail-view{overflow:hidden;padding:10px 0 14px;margin:-10px 0 0}
.rail-track{display:flex;gap:18px;transition:transform .9s var(--ease)}
.pcard{position:relative;flex:none;width:clamp(150px,15vw,200px);aspect-ratio:3/4.4;border-radius:14px;overflow:hidden;background:#223 center/cover;box-shadow:0 18px 40px rgba(0,0,0,.35);transition:transform .6s var(--ease),box-shadow .5s;cursor:pointer;border:0;padding:0;text-align:left;color:var(--text)}
.pcard:hover{transform:translateY(-8px)}
.pcard .ph{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1.2s var(--ease)}
.pcard:hover .ph{transform:scale(1.08)}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%)}
.pcard .cap{position:absolute;left:14px;right:12px;bottom:14px;z-index:1}
.pcard .cap .dash{width:12px;height:2px;margin-bottom:8px;display:block}
.pcard .cap small{display:block;font:400 11px/1.3 var(--f-head);color:rgba(255,255,255,.8)}
.pcard .cap b{display:block;font:400 23px/.95 var(--f-display);letter-spacing:.01em;text-transform:uppercase;margin-top:4px}
.pcard .votes{position:absolute;top:10px;right:10px;z-index:1}
.rail-ctrl{display:flex;align-items:center;gap:14px;margin-top:22px}
.circle{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--line-strong);background:none;display:grid;place-items:center;transition:background .3s,transform .3s var(--spring)}
.circle:hover{background:rgba(255,255,255,.12)}
.circle:active{transform:scale(.92)}
.circle svg{width:18px;height:18px}
.rail-line{flex:1;height:1.5px;background:var(--line-strong);position:relative;overflow:hidden}
.rail-line i{position:absolute;inset:0;background:var(--text);transform-origin:left;transition:transform .9s var(--ease)}
.counter{font:400 54px/1 var(--f-display);min-width:64px;text-align:right;overflow:hidden;height:54px}
.counter span{display:block;animation:wordUp .7s var(--ease) both}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:26px}
.stat{padding:20px 22px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font:500 12.5px var(--f-head);color:var(--muted);letter-spacing:.03em}
.stat .v{font:400 40px/1.05 var(--f-display);letter-spacing:.01em;margin:6px 0 4px}
.stat .v small{font:500 14px var(--f-head);color:var(--muted);margin-left:4px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--sun);transform-origin:left;animation:grow 1.4s var(--ease) both .3s}
.bar i.good{background:var(--good)}.bar i.bad{background:var(--bad)}
@keyframes grow{from{transform:scaleX(0)}}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);min-height:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.cols-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}.cols-2{grid-template-columns:1fr}}

.list{display:grid;gap:2px}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.07);min-width:0}
.li:last-child{border-bottom:0}
.li .t{font:500 14px/1.35 var(--f-head)}
.li .s{font-size:12.5px;color:var(--muted)}
.time{font:400 22px/1 var(--f-display);letter-spacing:.02em;min-width:52px}
.thumb{width:44px;height:44px;border-radius:10px;background:#2a3a33 center/cover;flex:none}

.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;flex:none;transition:--p 1s}
.ring::before{content:"";grid-area:1/1;width:78px;height:78px;border-radius:50%;background:rgba(12,19,16,.85)}
.ring b{grid-area:1/1;position:relative;font:400 28px var(--f-display)}

/* ---------- itinerary ---------- */
.days{margin-bottom:20px}
.day-head{display:flex;align-items:baseline;gap:14px;margin:4px 0 18px;flex-wrap:wrap}
.day-head b{font:400 64px/.9 var(--f-display)}
.day-head span{font:500 16px var(--f-head);color:var(--muted)}
.tl{position:relative;display:grid;gap:14px;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1.5px;background:var(--line-strong)}
.tl-item{position:relative;display:grid;grid-template-columns:70px 96px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px;border-radius:14px;transition:background .3s,transform .4s var(--ease)}
.tl-item:hover{background:rgba(255,255,255,.06)}
.tl-item::before{content:"";position:absolute;left:-25px;top:50%;width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--sun);transform:translateY(-50%)}
.tl-item .time{font-size:30px}
.tl-item .img{width:96px;height:72px;border-radius:10px;background:#2a3a33 center/cover;position:relative;overflow:hidden}
.tl-item h4{margin:0;font:500 16.5px/1.3 var(--f-head)}
.tl-item p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.tl-act{display:flex;gap:2px}
@media (max-width:640px){.tl-item{grid-template-columns:56px minmax(0,1fr) auto}.tl-item .img{display:none}.tl-item .time{font-size:24px}}
.empty{display:grid;place-items:center;text-align:center;gap:10px;padding:36px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.empty svg{width:30px;height:30px;opacity:.7}

/* ---------- places ---------- */
.place-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.place{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;background:#203029;box-shadow:0 18px 40px rgba(0,0,0,.3);transition:transform .6s var(--ease)}
.place:hover{transform:translateY(-6px)}
.place .ph{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1.4s var(--ease)}
.place:hover .ph{transform:scale(1.07)}
.place::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 45%,rgba(0,0,0,.82) 100%);pointer-events:none}
.place .top-r{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2}
.place .body{position:absolute;left:16px;right:16px;bottom:14px;z-index:2}
.place .body small{font:400 12px var(--f-head);color:rgba(255,255,255,.82)}
.place .body h4{margin:4px 0 10px;font:400 28px/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.place .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vote{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:#1b231e;font:600 13px var(--f-head);transition:transform .3s var(--spring),background .3s}
.vote svg{width:17px;height:17px;transition:transform .4s var(--spring)}
.vote.on{background:var(--sun);color:var(--sun-ink)}
.vote.on svg{fill:currentColor}
.vote:active svg{transform:scale(1.4)}
.vote.burst svg{animation:heart .6s var(--spring)}
@keyframes heart{0%{transform:scale(1)}30%{transform:scale(1.6) rotate(-10deg)}100%{transform:scale(1)}}
.all-in{position:absolute;inset:auto auto 0 0}
.ph-fallback{display:grid;place-items:center}
.ph-fallback svg{width:48px;height:48px;opacity:.55}
.rank{display:grid;gap:12px}
.rank-row{display:grid;grid-template-columns:22px 44px minmax(0,1fr);gap:12px;align-items:center}
.rank-row .n{font:400 22px var(--f-display);color:var(--faint)}
.rank-row:first-child .n{color:var(--sun)}

/* photo picker */
.pick-grid{display:grid;align-content:start;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-height:300px;overflow:auto;padding:2px}
.pick{position:relative;height:104px;border-radius:12px;overflow:hidden;background:#24332c center/cover;border:2px solid transparent;cursor:pointer;transition:transform .3s var(--spring),border-color .25s}
.pick:hover{transform:scale(1.03)}
.pick input{position:absolute;opacity:0}
.pick:has(input:checked){border-color:var(--sun);box-shadow:0 0 0 3px rgba(242,179,61,.3)}
.pick:has(input:checked)::before{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-weight:700;font-size:13px;z-index:2}
.pick .lbl{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font:500 11.5px/1.25 var(--f-head);background:linear-gradient(0deg,rgba(0,0,0,.8),transparent)}
.pick.up{display:grid;place-items:center;text-align:center;border:1.5px dashed var(--line-strong);background:rgba(255,255,255,.04);font:500 12px var(--f-head);color:var(--muted)}
.pick.up svg{width:22px;height:22px;margin:0 auto 4px}
.pick.place-pick{height:132px}
.ph-preview{position:relative;height:200px;border-radius:16px;overflow:hidden;background:#24332c center/cover}
.ph-preview::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent 55%);pointer-events:none}
.ph-preview .acts2{position:absolute;left:12px;right:12px;bottom:12px;z-index:1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph-preview .acts2 .btn{background:rgba(12,19,16,.55);backdrop-filter:blur(8px)}
.ph-preview .acts2 .btn.light{background:var(--text)}
.ph-preview .ph-fallback{position:absolute;inset:0}
.editable{cursor:pointer;border-radius:8px;transition:background .25s;padding:2px 6px;margin:-2px -6px}
.editable:hover{background:rgba(255,255,255,.1)}
.editable svg{width:14px;height:14px;vertical-align:-2px;margin-left:6px;opacity:.7}
.place .ph,.place .body h4{cursor:pointer}
.date-preview{font:500 13.5px var(--f-head);padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06)}
.date-preview.warn{background:rgba(242,179,61,.14);color:var(--warn)}

/* ---------- money ---------- */
.exp{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 6px;border-bottom:1px solid rgba(255,255,255,.07)}
.exp:last-child{border-bottom:0}
.cat-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.cat-ic svg{width:18px;height:18px}
.amt{font:400 26px/1 var(--f-display);letter-spacing:.02em;text-align:right}
.split-detail{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px}
.bal{display:grid;grid-template-columns:34px minmax(0,1fr) 110px;gap:12px;align-items:center;padding:8px 0}
.bal .track{height:8px;position:relative;background:rgba(255,255,255,.08);border-radius:9px}
.bal .track i{position:absolute;top:0;bottom:0;border-radius:9px;animation:grow 1.2s var(--ease) both}
.bal .track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line-strong)}
.settle{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:8px}
.arrow{display:flex;align-items:center;gap:8px;font:500 13.5px var(--f-head);min-width:0}
.arrow svg{width:16px;height:16px;color:var(--sun);flex:none}
.split-box{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.split-row{display:grid;grid-template-columns:auto minmax(0,1fr) 120px;gap:10px;align-items:center}
.split-row .in{height:38px}
.mchip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1.5px solid var(--line);cursor:pointer;transition:border-color .25s,background .25s;font:500 13px var(--f-head)}
.mchip input{position:absolute;opacity:0;pointer-events:none}
.mchip:has(input:checked){border-color:var(--sun);background:rgba(242,179,61,.14)}
.sum-line{font:500 13px var(--f-head);display:flex;justify-content:space-between;gap:10px}
.sum-line.ok{color:var(--good)}.sum-line.err{color:var(--bad)}
[data-show]{display:none}
form[data-mode="equal"] [data-show="equal"],form[data-mode="percent"] [data-show="percent"],form[data-mode="custom"] [data-show="custom"]{display:grid}

/* ---------- pay ---------- */
.acct{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:10px}
.acct .logo-b{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 11px var(--f-head);color:#fff}
.acct .no{font:500 15px var(--f-head);letter-spacing:.04em}
.qr-wrap{display:grid;justify-items:center;gap:10px;padding:18px;border-radius:16px;background:#fff;color:#14201a;width:max-content;max-width:100%;margin:0 auto}
.qr-wrap .pp{font:700 13px var(--f-head);letter-spacing:.08em;color:#0e3a69;display:flex;align-items:center;gap:8px}
.qr-wrap .pp i{display:inline-block;width:18px;height:18px;border-radius:4px;background:#0e3a69}
#qr canvas,#qr img{width:200px!important;height:200px!important;image-rendering:pixelated}
.copy-row{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04)}
.copy-row .v{flex:1;min-width:0;font:500 15px var(--f-head);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{display:grid;place-items:center;gap:6px;padding:20px;border:1.5px dashed var(--line-strong);border-radius:14px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .25s,background .25s;font-size:13px}
.drop:hover,.drop.over{border-color:var(--sun);background:rgba(242,179,61,.07)}
.drop svg{width:24px;height:24px}
.drop img{max-height:220px;border-radius:10px}
.slip-thumb{width:48px;height:64px;border-radius:8px;background:#333 center/cover;flex:none;border:1px solid var(--line);cursor:zoom-in}

/* ---------- checklist ---------- */
.ck{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;transition:background .25s}
.ck:hover{background:rgba(255,255,255,.05)}
.ck .box{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none;background:none;padding:0;transition:background .3s,border-color .3s}
.ck .box svg{width:14px;height:14px;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .45s var(--ease) .05s;stroke-width:3}
.ck.done .box{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.ck.done .box svg{stroke-dashoffset:0}
.ck .txt{flex:1;min-width:0;position:relative;transition:color .3s}
.ck .txt::after{content:"";position:absolute;left:0;top:52%;height:1.5px;width:100%;background:var(--faint);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.ck.done .txt{color:var(--faint)}
.ck.done .txt::after{transform:scaleX(1)}
.ck-group h4{margin:18px 0 6px;font:500 13px var(--f-head);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* ---------- memories ---------- */
.mem-grid{columns:3 260px;column-gap:16px}
.mem{break-inside:avoid;margin-bottom:16px;border-radius:16px;overflow:hidden;position:relative;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);animation:rise .7s var(--ease) both}
.mem img{width:100%;cursor:zoom-in;transition:transform 1s var(--ease)}
.mem:hover img{transform:scale(1.03)}
.mem .cap{padding:14px 16px}
.mem .cap p{margin:0 0 8px;font-size:14px}
.mem.note .cap p{font:500 19px/1.45 var(--f-head)}
.mem .del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);color:#fff}

/* ---------- members ---------- */
.mem-card{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border-radius:14px;transition:background .25s}
.mem-card:hover{background:rgba(255,255,255,.05)}
.mem-card.creator{background:linear-gradient(90deg,rgba(242,179,61,.16),rgba(242,179,61,0));}
.code{font:400 46px/1 var(--f-display);letter-spacing:.14em;color:var(--sun)}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(4,8,6,.55);backdrop-filter:blur(6px);animation:fadeIn .35s ease both;overflow:auto}
.modal-wrap.out{animation:fadeOut .3s ease both}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:rgba(18,26,22,.9);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:22px;padding:26px;animation:modalIn .55s var(--ease) both;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.modal.wide{width:min(820px,100%)}
.modal-wrap.out .modal{animation:modalOut .3s ease both}
.modal h2{margin:0 0 4px;font:400 40px/1 var(--f-display);letter-spacing:.01em}
.modal .sub{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.modal form{display:grid;gap:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes modalOut{to{opacity:0;transform:translateY(20px) scale(.97)}}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:24px;animation:fadeIn .3s both;cursor:zoom-out}
.lightbox img{max-height:90vh;border-radius:12px;animation:modalIn .5s var(--ease) both}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:100;padding:12px 20px;border-radius:999px;background:var(--text);color:#16201b;font:500 13.5px var(--f-head);transition:all .5s var(--spring);pointer-events:none;box-shadow:0 14px 30px rgba(0,0,0,.35);max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* bg picker */
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pick.bg-opt{height:84px}
.range{width:100%;accent-color:var(--sun)}

/* ---------- presentation ---------- */
#present{position:fixed;inset:0;z-index:120;background:#050807;overflow:hidden;perspective:1600px}
#present .slide{position:absolute;inset:0;display:grid;align-items:center;padding:clamp(24px,6vw,96px);transition:transform 1s var(--ease),opacity 1s var(--ease),filter 1s var(--ease);will-change:transform,opacity;pointer-events:none}
#present .slide.active{pointer-events:auto;z-index:2}
#present .sbg{position:absolute;inset:-4%;background-size:cover;background-position:center;z-index:-1}
#present .slide.active .sbg{animation:kenburns 14s ease-out both}
@keyframes kenburns{from{transform:scale(1.15) translate(2%,1%)}to{transform:scale(1) translate(0,0)}}
#present .sbg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,8,6,.85),rgba(4,8,6,.45)),linear-gradient(0deg,rgba(4,8,6,.8),transparent 50%)}
/* fade */
.fx-fade .slide{opacity:0}.fx-fade .slide.active{opacity:1}
/* zoom */
.fx-zoom .slide[data-pos="before"]{opacity:0;transform:scale(1.25);filter:blur(8px)}
.fx-zoom .slide[data-pos="after"]{opacity:0;transform:scale(.82);filter:blur(8px)}
/* push */
.fx-push .slide[data-pos="before"]{transform:translateX(-100%)}
.fx-push .slide[data-pos="after"]{transform:translateX(100%)}
/* cube */
.fx-cube .slide[data-pos="before"]{transform:translateX(-50%) rotateY(70deg) translateX(-50%);opacity:0}
.fx-cube .slide[data-pos="after"]{transform:translateX(50%) rotateY(-70deg) translateX(50%);opacity:0}
/* reveal-up */
.fx-rise .slide[data-pos="before"]{transform:translateY(-30%);opacity:0}
.fx-rise .slide[data-pos="after"]{transform:translateY(100%)}
#present .rv{opacity:0}
#present .slide.active .rv{animation:rise .9s var(--ease) both;animation-delay:calc(.35s + var(--i,0)*.11s)}
#present .ptitle{overflow-wrap:anywhere;font:400 clamp(70px,13vw,200px)/.85 var(--f-display);text-transform:uppercase;margin:0;text-wrap:balance}
#present h2{font:400 clamp(48px,7vw,104px)/.9 var(--f-display);margin:0 0 28px;text-transform:uppercase}
#present .kick{font:500 clamp(14px,1.6vw,20px) var(--f-head);color:var(--muted);display:flex;align-items:center;gap:12px;margin-bottom:12px}
#present .big{font:400 clamp(48px,7vw,96px)/1 var(--f-display)}
.pbar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:14px;padding:16px clamp(16px,3vw,36px) calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.pbar .rail-line{max-width:none}
.pbar select{height:36px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);padding:0 12px}
.pbar select option{background:#1a231e}
.pclose{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:6}
.p-cards{display:flex;gap:20px;flex-wrap:wrap}
.p-cards .pcard{width:clamp(150px,18vw,230px)}
.p-list{display:grid;gap:14px;max-width:900px}
.p-row{display:grid;grid-template-columns:90px 120px minmax(0,1fr);gap:20px;align-items:center}
.p-row .time{font-size:clamp(28px,3vw,40px)}
.p-row .img{height:80px;border-radius:12px;background:#223 center/cover}
.p-row h4{margin:0;font:500 clamp(17px,2vw,24px)/1.25 var(--f-head)}
@media (max-width:640px){.p-row{grid-template-columns:64px minmax(0,1fr)}.p-row .img{display:none}}
.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;max-width:1100px}
.p-collage{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;max-width:1100px}
.p-collage img{border-radius:12px;aspect-ratio:1;object-fit:cover;width:100%}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.15s!important}
}

  const msg=code==='permission-denied'?'Firebase ไม่ให้สิทธิ์บันทึก ตรวจ Rules ของ Firestore':code==='invalid_argument'?'บันทึกไม่ได้: ข้อมูลทริปใหญ่เกิน หรือบัญชีนี้มีสิทธิ์ดูอย่างเดียว':code==='quota_exceeded'?'บันทึกไม่ได้: พื้นที่เก็บข้อมูลเต็ม ลองลบรูปหรือทริปเก่า':'บันทึกไม่สำเร็จ เดี๋ยวลองใหม่ให้อัตโนมัติ';
  if(lastErr!==msg){toast(msg);lastErr=msg}
}
async function flush(){
  if(MODE==='local'){const ok=LS.set(KEY,JSON.stringify(S));setSave(ok?'local':'fail');if(!ok)saveErr('local');return}
  if(MODE!=='cloud'||!DB)return;
  if(flushing){again=true;return}
  const jobs=[];
  for(const t of S.trips){const j=JSON.stringify(t);if(synced[t.id]!==j)jobs.push(['set',t.id,j])}
  for(const id in synced){if(id!=='__app'&&!S.trips.some(t=>t.id===id))jobs.push(['del',id])}
  const app=JSON.stringify({customBgs:S.customBgs||[],myPhotos:S.myPhotos||[]});
  if(synced.__app!==app)jobs.push(['app','__app',app]);
  if(!jobs.length)return;
  flushing=true;setSave('saving');let err=null;
  for(const [op,id,j] of jobs){
    dirty.add(id);
    try{
      if(op==='set')await DB.doc('trips/'+id).set(JSON.parse(j));
      else if(op==='del')await DB.doc('trips/'+id).delete();
      else await DB.doc('app/settings').set(JSON.parse(j));
      if(op==='del')delete synced[id];else synced[id]=j;
    }catch(e){err=e}
    dirty.delete(id);
  }
  flushing=false;
  if(err){setSave('fail');saveErr(err&&err.code)}else{setSave('saved');lastErr=''}
  if(again){again=false;flush()}
}

function startSync(db){
  DB=db;
  db.doc('app/settings').onSnapshot(snap=>{
    if(dirty.has('__app')||!snap.exists)return;const d=snap.data();
    const j=JSON.stringify({customBgs:d.customBgs||[],myPhotos:d.myPhotos||[]});if(synced.__app===j)return;
    synced.__app=j;const o=JSON.parse(j);S.customBgs=o.customBgs;S.myPhotos=o.myPhotos;
  },()=>{});
  db.collection('trips').onSnapshot(snap=>{
    if(MODE==='loading'&&snap.metadata.fromCache&&snap.empty)return;
    let changed=false;const seen=new Set();
    snap.docs.forEach(d=>{seen.add(d.id);if(dirty.has(d.id))return;const j=JSON.stringify(d.data());if(synced[d.id]===j)return;
      synced[d.id]=j;const t=JSON.parse(j);const i=S.trips.findIndex(x=>x.id===d.id);if(i>=0)S.trips[i]=t;else S.trips.push(t);changed=true});
    S.trips=S.trips.filter(t=>{if(seen.has(t.id)||dirty.has(t.id)||synced[t.id]===undefined)return true;delete synced[t.id];changed=true;return false});
    S.trips.sort((a,b)=>(b.created||'').localeCompare(a.created||''));
    if(MODE==='loading'){MODE='cloud';render();setSave('saved');return}
    if(changed)safeRender();
  },e=>{setSave('fail');toast(e&&e.code==='permission-denied'?'Firebase ไม่ให้สิทธิ์อ่านข้อมูล ตรวจ Rules ของ Firestore':'การเชื่อมต่อหลุด รีโหลดหน้าเพื่อเชื่อมใหม่')});
}

function owed(e){
  const o={};
  if(e.mode==='equal'){const n=e.parts.length||1;e.parts.forEach(id=>o[id]=e.amount/n)}
  else if(e.mode==='percent'){for(const id in e.shares)o[id]=e.amount*(+e.shares[id]||0)/100}
  else{for(const id in e.shares)o[id]=+e.shares[id]||0}
  return o;
}
function balances(t){
  const b={};t.members.forEach(m=>b[m.id]=0);
  t.expenses.forEach(e=>{b[e.payer]=(b[e.payer]||0)+e.amount;const o=owed(e);for(const id in o)b[id]=(b[id]||0)-o[id]});
  t.payments.filter(p=>p.status==='paid').forEach(p=>{b[p.from]=(b[p.from]||0)+p.amount;b[p.to]=(b[p.to]||0)-p.amount});
  for(const k in b)b[k]=r2(b[k]);
  return b;
}
function settlements(t){
  const b=balances(t);
  const cred=[],debt=[];
  for(const id in b){if(b[id]>0.5)cred.push({id,v:b[id]});else if(b[id]<-0.5)debt.push({id,v:-b[id]})}
  cred.sort((a,c)=>c.v-a.v);debt.sort((a,c)=>c.v-a.v);
  const out=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){const x=Math.min(debt[i].v,cred[j].v);out.push({from:debt[i].id,to:cred[j].id,amount:r2(x)});debt[i].v-=x;cred[j].v-=x;if(debt[i].v<0.5)i++;if(cred[j].v<0.5)j++}
  return out;
}
const spent=t=>t.expenses.reduce((s,e)=>s+e.amount,0);

/* PromptPay EMVCo payload */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let k=0;k<8;k++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amount){
  const t=String(id).replace(/\D/g,'');const f=(k,v)=>k+String(v.length).padStart(2,'0')+v;
  let tag,val;
  if(t.length===15){tag='03';val=t}else if(t.length===13){tag='02';val=t}else{tag='01';val=('0000000000000'+'66'+t.replace(/^0/,'')).slice(-13)}
  let p=f('00','01')+f('01',amount?'12':'11')+f('29',f('00','A000000677010111')+f(tag,val))+f('53','764');
  if(amount)p+=f('54',Number(amount).toFixed(2));
  p+=f('58','TH')+'6304';
  return p+crc16(p);
}

function moveRail(d){
  const tr=$('#railTrack');if(!tr)return;const cards=$$('.pcard',tr);if(!cards.length)return;
  const vis=Math.max(1,Math.floor(tr.parentElement.clientWidth/(cards[0].offsetWidth+18)));
  const max=Math.max(0,cards.length-vis);
  railI=Math.max(0,Math.min(max,railI+d));
  tr.style.transform=`translateX(${-railI*(cards[0].offsetWidth+18)}px)`;
  const line=$('#railLine');if(line)line.style.transform=`scaleX(${(railI+vis)/cards.length})`;
  const c=$('#railCount');if(c&&d!==0||c&&!c.dataset.v){c.dataset.v=1;c.innerHTML=`<span>${String(railI+1).padStart(2,'0')}</span>`}
}

  const res={amount,mode,parts:[],shares:{},ok:true,msg:''};
  if(mode==='equal'){res.parts=fd.getAll('part');res.ok=res.parts.length>0;res.msg=res.ok?`คนละ ${baht(r2(amount/res.parts.length),true)} (${res.parts.length} คน)`:'เลือกอย่างน้อย 1 คน'}
  else if(mode==='percent'){let s=0;t.members.forEach(m=>{const v=+fd.get('pct-'+m.id)||0;if(v>0){res.shares[m.id]=v;s+=v}});s=r2(s);res.ok=Math.abs(s-100)<0.01;res.msg=res.ok?'รวม 100% ครบ':`รวม ${s}% (${s<100?'ขาดอีก '+r2(100-s):'เกินมา '+r2(s-100)}%)`}
  else{let s=0;t.members.forEach(m=>{const v=+fd.get('amt-'+m.id)||0;if(v>0){res.shares[m.id]=v;s+=v}});s=r2(s);res.ok=Math.abs(s-amount)<0.01&&amount>0;res.msg=res.ok?`รวม ${baht(s,true)} ตรงกับยอด`:`รวม ${baht(s,true)} / ต้องเท่ากับ ${baht(amount,true)} (${s<amount?'ขาด '+baht(r2(amount-s),true):'เกิน '+baht(r2(s-amount),true)})`}
  return res;
}

function openModal(html,wide){
  closeModal(true);
  const w=document.createElement('div');w.className='modal-wrap';w.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  w.addEventListener('mousedown',e=>{if(e.target===w)closeModal()});
  document.body.appendChild(w);
  setTimeout(()=>{const f=w.querySelector('input:not([type=radio]):not([type=checkbox]):not([type=hidden]),select');f&&f.focus({preventScroll:true})},80);
}
function closeModal(instant){$$('.modal-wrap').forEach(w=>{if(instant)return w.remove();w.classList.add('out');setTimeout(()=>w.remove(),280)})}

function tripModal(edit){

  const list=edit?'':`<div class="field"><span>ทริปของฉัน</span><div style="display:grid;gap:10px">${S.trips.map(x=>`<button type="button" class="acct" data-act="trip-open" data-id="${x.id}" style="border:1px solid ${x.id===S.cur?'var(--sun)':'transparent'};margin:0;text-align:left;color:inherit;width:100%"><span class="thumb" style="width:44px;height:44px;background:${bgCss(x.bg)} center/cover"></span><div style="min-width:0"><div style="font:500 15px var(--f-head)">${esc(x.name)}</div><div class="muted" style="font-size:12.5px">${dLong(x.start)} – ${dLong(x.end)} · ${x.members.length} คน</div></div>${x.id===S.cur?'<span class="chip sun">เปิดอยู่</span>':ic('right')}</button>`).join('')}</div></div><hr style="border:0;border-top:1px solid var(--line);margin:4px 0">`;
  openModal(`<h2>${edit?'แก้ไขทริป':'ทริปทั้งหมด'}</h2><p class="sub">${edit?'เปลี่ยนชื่อ สถานที่ วันไป–วันกลับ และงบประมาณ':'สลับไปทริปอื่น หรือสร้างทริปใหม่แล้วชวนเพื่อน'}</p>
  <form data-form="trip" data-edit="${edit?1:''}">${list}
    ${edit?'':'<h3 style="margin:0;font:600 17px var(--f-head)">สร้างทริปใหม่</h3>'}
    <label class="field"><span>ชื่อทริป</span><input class="in" id="f-tname" name="name" value="${esc(t.name)}" required placeholder="เช่น Tokyo Winter"></label>
    <label class="field"><span>ที่ไหน</span><input class="in" id="f-tloc" name="location" value="${esc(t.location)}" placeholder="เช่น ญี่ปุ่น · โตเกียว"></label>
    <div class="grid-f">
      <label class="field"><span>วันไป</span><input class="in" id="f-tstart" type="date" name="start" value="${t.start}" required></label>
      <label class="field"><span>วันกลับ</span><input class="in" id="f-tend" type="date" name="end" value="${t.end}" required></label>
      <label class="field"><span>งบประมาณรวม (บาท)</span><input class="in num" id="f-tbud" type="number" min="0" name="budget" value="${t.budget}"></label>
    </div>
    ${edit?`<div class="date-preview" id="datePrev"></div>`:''}
    ${edit?'':`<label class="field"><span>ชื่อของคุณ (ผู้สร้างทริป)</span><input class="in" id="f-tme" name="me" value="${esc(me().name)}" required></label>
    <label class="field"><span>ชวนเพื่อน (คั่นด้วยจุลภาค)</span><input class="in" id="f-tfr" name="friends" placeholder="เช่น ต้น, แพร, บอส"></label>
    <div class="field"><span>ภาพพื้นหลังทริป</span><div class="pick-grid" style="max-height:200px">${BG_PRESETS.map((k,i)=>`<label class="pick bg-opt" style="background:${bgCss(k)} center/cover"><input type="radio" name="bg" value="${k}" ${i===1?'checked':''}></label>`).join('')}</div></div>`}
    <div class="acts">${edit&&S.trips.length>1?`<button type="button" class="btn danger" data-act="trip-del" style="margin-right:auto">${ic('trash')} ลบทริป</button>`:''}<button type="button" class="btn" data-act="close">ปิด</button><button class="btn sun">${edit?'บันทึก':'สร้างทริป'}</button></div>
  </form>`,!edit);
  if(edit)tripPreview($('form[data-form="trip"]'));
}
function tripPreview(f){
  const el=$('#datePrev');if(!el||!f)return;const t=T();
  const s=f.elements.start.value,e=f.elements.end.value;if(!s||!e)return;
  if(pd(e)<pd(s)){el.className='date-preview warn';el.textContent='วันกลับต้องไม่ก่อนวันไป';return}
  const n=dayDiff(pd(s),pd(e))+1,lost=t.plan.filter(i=>i.day>=n).length;
  el.className='date-preview'+(lost?' warn':'');
  el.innerHTML=`${dWeek(s)} – ${dWeek(e)} · ${n} วัน (เดิม ${nDays(t)} วัน)<br><span style="font-weight:400;font-size:12.5px">${lost?`ทริปสั้นลง: กิจกรรม ${lost} รายการจากวันที่ตัดออกจะย้ายไปอยู่วันสุดท้าย`:'กิจกรรมในตารางจะเลื่อนตามวันใหม่ให้อัตโนมัติ (วันที่ 1 ยังเป็นวันที่ 1)'}</span>`;
}

function whoModal(){
  const t=T();
  openModal(`<h2>ฉันคือใคร?</h2><p class="sub">ใช้ตอนโหวต เพิ่มบัญชี และโพสต์ความทรงจำ (ทุกคนในทริปใช้หน้านี้ร่วมกันได้)</p>
  <div style="display:grid;gap:8px">${t.members.map(m=>`<button class="acct" data-act="setme" data-id="${m.id}" style="margin:0;border:1px solid ${m.id===S.me?'var(--sun)':'transparent'};color:inherit;text-align:left;width:100%">${avatar(m,'',m.id===t.creator)}<div><b style="font:500 15px var(--f-head)">${esc(m.name)}</b><div class="muted" style="font-size:12.5px">${m.id===t.creator?'ผู้สร้างทริป':'สมาชิก'}</div></div>${m.id===S.me?'<span class="chip sun">ฉัน</span>':''}</button>`).join('')}</div>`);
}

/* ================= upload ================= */
let uploadKind='',uploadTarget='';
function rememberPhoto(d){S.myPhotos=[d,...(S.myPhotos||[]).filter(x=>x!==d)].slice(0,8)}
function readImage(file,max=1280,q=.82){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
}
async function handleFile(file){
  if(!file||!file.type.startsWith('image/'))return toast('เลือกไฟล์รูปภาพนะ');
  const kind=uploadKind;
  const big=MODE==='local'||ASSETS||FS;
  const raw=await readImage(file,kind==='bg'?(big?1800:1100):kind==='slip'?(big?1000:800):(big?1200:800),big?.82:.7).catch(()=>null);
  if(!raw)return toast('อ่านรูปไม่สำเร็จ');
  let data=raw;
  if(MODE==='cloud'&&FS){
    toast('กำลังอัปโหลดรูป…');
    try{const id=uid()+uid();await FS.collection('photos').doc(id).set({data:raw,at:new Date().toISOString()});PHOTO[id]=raw;data='fs:'+id}
    catch(e){toast('อัปโหลดรูปไม่สำเร็จ');return}
  }
  else if(MODE==='cloud'&&ASSETS){
    toast('กำลังอัปโหลดรูป…');
    try{const bin=atob(raw.split(',')[1]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      const r=await ASSETS.upload(new Blob([u],{type:'image/jpeg'}),{type:'image/jpeg'});data='asset:'+r.id}
    catch(e){toast(e&&e.code==='quota_or_state'?'พื้นที่เก็บรูปเต็ม ใช้รูปขนาดเล็กแทน':'อัปโหลดรูปไม่สำเร็จ ใช้รูปขนาดเล็กแทน');data=await readImage(file,700,.65).catch(()=>raw)}
  }
  if(kind==='bg'){S.customBgs.unshift(data);S.customBgs=S.customBgs.slice(0,6);T().bg=data;render(false);bgModal();toast('ตั้งเป็นพื้นหลังแล้ว')}
  else if(kind==='place-quick'){const p=T().places.find(x=>x.id===uploadTarget);if(p){p.img=data;rememberPhoto(data);render(false);toast('เปลี่ยนรูป '+p.name+' แล้ว')}}
  else if(kind==='place'){draftImg=data;const g=$('#imgPick');if(g){$$('input[value="__draft"]',g).forEach(x=>x.closest('label').remove());g.children[0].insertAdjacentHTML('afterend',`<label class="pick" style="background-image:url('${src(data)}');animation:pop .5s var(--spring)"><input type="radio" name="img" value="__draft" checked><span class="lbl">รูปที่อัปโหลด</span></label>`)}drawPlacePreview()}
  else if(kind==='slip'){slipDraft=data;const d=$('#slipDrop');if(d)d.innerHTML=`<img src="${src(data)}" alt="สลิป"><span>${ic('tick')} แนบสลิปแล้ว · กดเพื่อเปลี่ยน</span>`}
  else if(kind==='mem'){memDraft=data;const d=$('#memDrop');if(d)d.innerHTML=`<img src="${src(data)}" alt="">`}
}
$('#fileIn').addEventListener('change',e=>{handleFile(e.target.files[0]);e.target.value=''});
document.addEventListener('dragover',e=>{const d=e.target.closest('.drop,.pick.up');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('.drop,.pick.up');d&&d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest('[data-kind]');if(d){e.preventDefault();d.classList.remove('over');uploadKind=d.dataset.kind;handleFile(e.dataTransfer.files[0])}});

/* ================= copy ================= */
function copy(v){
  const ok=()=>toast('คัดลอกแล้ว: '+(v.length>40?v.slice(0,40)+'…':v));
  const fb=()=>{const ta=document.createElement('textarea');ta.value=v;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){toast('คัดลอกไม่ได้ กรุณาเลือกข้อความเอง')}ta.remove()};
  try{navigator.clipboard.writeText(v).then(ok,fb)}catch(e){fb()}
}

/* ================= events ================= */
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.btn,.fab,.circle,.vote');if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2;
  const sp=document.createElement('span');sp.className='ripple';sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  if(getComputedStyle(b).position==='static')b.style.position='relative';
  b.appendChild(sp);setTimeout(()=>sp.remove(),700);
});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();closeModal();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const t=T(),id=a.dataset.id,act=a.dataset.act;
  if(!t&&!['trips','close','upload','copy','seed-sample'].includes(act))return;
  switch(act){
    case 'seed-sample':{const sd=seed();S.trips=sd.trips;S.cur=sd.cur;S.me=sd.me;S.view='home';render();toast('ใส่ทริปตัวอย่างแล้ว');break}
    case 'close':closeModal();break;
    case 'rail':moveRail(+a.dataset.d);break;
    case 'present':startPresent();break;
    case 'bg':bgModal();break;
    case 'trips':tripModal(false);break;
    case 'trip-edit':tripModal(true);break;
    case 'trip-open':S.cur=id;S.me=T().members.find(m=>m.id===S.me)?S.me:T().creator;closeModal();S.view='home';render();toast('เปิดทริป '+T().name);break;
    case 'trip-del':{if(a.dataset.sure){S.trips=S.trips.filter(x=>x.id!==t.id);S.cur=S.trips[0].id;closeModal();render();toast('ลบทริปแล้ว')}else{a.dataset.sure=1;a.innerHTML=ic('trash')+' กดอีกครั้งเพื่อยืนยัน'}break}
    case 'whoami':whoModal();break;
    case 'setme':S.me=id;closeModal();render(false);toast('ตอนนี้คุณคือ '+M(id).name);break;
    case 'upload':e.preventDefault();uploadKind=a.dataset.kind;uploadTarget=a.dataset.id||'';$('#fileIn').click();break;
    case 'copy':copy(a.dataset.v);break;
    case 'zoom':{let s='';const v=a.dataset.src;if(v.startsWith('m:'))s=src(t.memories.find(m=>m.id===v.slice(2))?.img);else s=src(t.payments.find(p=>p.id===v)?.slip);if(s){const l=document.createElement('div');l.className='lightbox';l.innerHTML=`<img src="${s}" alt="">`;l.onclick=()=>l.remove();document.body.appendChild(l)}break}
    case 'day':planDay=+a.dataset.i;render(true);break;
    case 'item-new':itemModal(null);break;
    case 'item-edit':itemModal(t.plan.find(i=>i.id===id));break;
    case 'item-del':t.plan=t.plan.filter(i=>i.id!==id);render(false);toast('ลบกิจกรรมแล้ว');break;
    case 'place-new':placeModal(null);break;
    case 'place-edit':placeModal(t.places.find(p=>p.id===id));break;
    case 'place-plan':itemModal(null,id);break;
    case 'ph-clear':{const r=$('#imgPick input[value=""]');if(r)r.checked=true;drawPlacePreview();break}
    case 'place-del':t.places=t.places.filter(p=>p.id!==id);t.plan.forEach(i=>{if(i.place===id)i.place=''});closeModal();render(false);toast('ลบสถานที่แล้ว');break;
    case 'pfilter':placeFilter=a.dataset.k;render(false);break;
    case 'vote':{const p=t.places.find(x=>x.id===id);const i=p.votes.indexOf(S.me);if(i>=0)p.votes.splice(i,1);else p.votes.push(S.me);
      const on=i<0;render(false);const nb=$(`.vote[data-id="${id}"]`);if(nb&&on){nb.classList.add('burst')}toast(on?`${me().name} โหวต ${p.name}`:'ยกเลิกโหวตแล้ว');break}
    case 'exp-new':expModal(null);break;
    case 'exp-edit':expModal(t.expenses.find(x=>x.id===id));break;
    case 'exp-del':t.expenses=t.expenses.filter(x=>x.id!==id);render(false);toast('ลบรายการแล้ว');break;
    case 'pay':payModal(a.dataset.from,a.dataset.to,+a.dataset.amt);break;
    case 'paydel':t.payments=t.payments.filter(p=>p.id!==id);render(false);toast('ยกเลิกรายการโอนแล้ว');break;
    case 'acct-new':acctModal();break;
    case 'acct-del':me().accounts=me().accounts.filter(x=>x.id!==id);render(false);break;
    case 'ck':{const c=t.checklist.find(x=>x.id===id);c.done=!c.done;const row=a.closest('.ck');row.classList.toggle('done',c.done);a.setAttribute('aria-pressed',c.done);save();setTimeout(()=>render(false),500);break}
    case 'ck-del':t.checklist=t.checklist.filter(x=>x.id!==id);render(false);break;
    case 'mem-del':t.memories=t.memories.filter(x=>x.id!==id);render(false);break;
    case 'mem-remove':{if(a.dataset.sure){t.members=t.members.filter(m=>m.id!==id);t.places.forEach(p=>p.votes=p.votes.filter(v=>v!==id));if(S.me===id)S.me=t.creator;render(false);toast('เอาออกจากทริปแล้ว')}else{a.dataset.sure=1;a.style.color='var(--bad)';a.title='กดอีกครั้งเพื่อยืนยัน';toast('กดอีกครั้งเพื่อยืนยันการเอาออก')}break}
  }
});
document.addEventListener('input',e=>{
  const f=e.target.closest('form');if(!f)return;
  if(f.dataset.form==='exp'){if(e.target.name==='mode')f.dataset.mode=e.target.value;splitSummary(f)}
  if(f.dataset.form==='pay'&&(e.target.name==='acct'||e.target.name==='amount')){clearTimeout(drawPayBox.t);drawPayBox.t=setTimeout(drawPayBox,250)}
  if(f.dataset.form==='bg'){const t=T();if(e.target.name==='bg')t.bg=e.target.value;if(e.target.name==='dim')t.dim=+e.target.value;if(e.target.name==='blur')t.blur=+e.target.value;applyBg();chrome();save()}
  if(f.dataset.form==='place'&&['img','type','name'].includes(e.target.name))drawPlacePreview();
  if(f.dataset.form==='trip'&&['start','end'].includes(e.target.name))tripPreview(f);
  if(f.dataset.form==='item'&&e.target.name==='place'){const ti=$('#f-title');if(ti&&!ti.value&&e.target.dataset.name)ti.value=e.target.dataset.name}
});
document.addEventListener('change',e=>{const f=e.target.closest('form');if(f&&f.dataset.form==='exp'&&e.target.name==='mode'){f.dataset.mode=e.target.value;splitSummary(f)}});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  const t=T(),fd=new FormData(f),id=f.dataset.id;
  switch(f.dataset.form){
    case 'item':{const o={day:+fd.get('day'),time:fd.get('time'),title:fd.get('title').trim(),note:fd.get('note').trim(),place:fd.get('place')||''};
      if(!o.title){const p=t.places.find(x=>x.id===o.place);o.title=p?p.name:'กิจกรรม'}
      if(id)Object.assign(t.plan.find(i=>i.id===id),o);else t.plan.push({id:uid(),...o});
      planDay=o.day;closeModal();S.view==='plan'?render(false):go('plan');toast('บันทึกลงตารางแล้ว');break}
    case 'place':{let img=fd.get('img')||'';if(img==='__draft')img=draftImg;if(isCustom(img))rememberPhoto(img);
      const o={name:fd.get('name').trim(),type:fd.get('type')||'sight',area:fd.get('area').trim(),img,note:fd.get('note').trim()};
      if(id)Object.assign(t.places.find(p=>p.id===id),o);else t.places.push({id:uid(),votes:[S.me],...o});
      closeModal();render(false);toast(id?'บันทึกแล้ว':'เพิ่มสถานที่แล้ว (โหวตให้อัตโนมัติ)');break}
    case 'exp':{const r=readSplit(f);if(!(r.amount>0))return toast('ใส่จำนวนเงินก่อน');if(!r.ok)return toast(r.msg);
      const o={title:fd.get('title').trim(),amount:r2(r.amount),payer:fd.get('payer'),cat:fd.get('cat'),date:fd.get('date')||iso(TODAY),mode:r.mode,parts:r.parts,shares:r.shares};
      if(id)Object.assign(t.expenses.find(x=>x.id===id),o);else t.expenses.push({id:uid(),...o});
      closeModal();render(false);toast('บันทึกค่าใช้จ่ายแล้ว');break}
    case 'pay':{const amt=r2(+fd.get('amount'));if(!(amt>0))return toast('ใส่จำนวนเงิน');
      t.payments.push({id:uid(),from:f.dataset.from,to:f.dataset.to,amount:amt,slip:slipDraft,date:iso(TODAY),status:'paid'});slipDraft='';
      closeModal();render(false);toast('บันทึกว่าจ่ายแล้ว ✓');break}
    case 'acct':{const type=fd.get('type'),num=fd.get('number').trim();const digits=num.replace(/\D/g,'');
      if(type==='promptpay'&&![10,13,15].includes(digits.length))return toast('พร้อมเพย์ต้องเป็นเบอร์ 10 หลัก หรือเลขบัตร 13 หลัก');
      me().accounts.push({id:uid(),type,bank:type==='bank'?fd.get('bank'):'',number:num,name:fd.get('name').trim()});closeModal();render(false);toast('เพิ่มบัญชีแล้ว');break}
    case 'ck':{t.checklist.push({id:uid(),text:fd.get('text').trim(),cat:fd.get('cat'),who:fd.get('who'),done:false});render(false);setTimeout(()=>$('#f-ck')?.focus(),50);break}
    case 'mem':{const text=fd.get('text').trim();if(!text&&!memDraft)return toast('ใส่รูปหรือเขียนอะไรสักหน่อย');
      t.memories.push({id:uid(),img:memDraft,text,who:S.me,date:iso(TODAY)});memDraft='';render(false);toast('เก็บโมเมนต์แล้ว');break}
    case 'addmem':{const name=fd.get('name').trim();t.members.push({id:uid(),name,color:COLORS[t.members.length%COLORS.length],joined:iso(TODAY),accounts:[]});render(false);toast(`เพิ่ม ${name} เข้าทริปแล้ว`);break}
    case 'trip':{const s=fd.get('start'),en=fd.get('end');if(pd(en)<pd(s))return toast('วันกลับต้องไม่ก่อนวันไป');
      if(f.dataset.edit){Object.assign(t,{name:fd.get('name').trim(),location:fd.get('location').trim(),start:s,end:en,budget:+fd.get('budget')||0});const d=nDays(t);t.plan.forEach(i=>{if(i.day>=d)i.day=d-1});closeModal();render();toast('บันทึกทริปแล้ว');break}
      const meM={id:uid(),name:fd.get('me').trim(),color:COLORS[0],joined:iso(TODAY),accounts:[...me().accounts]};
      const fr=(fd.get('friends')||'').split(/[,،\n]/).map(x=>x.trim()).filter(Boolean).map((n,i)=>({id:uid(),name:n,color:COLORS[(i+1)%COLORS.length],joined:iso(TODAY),accounts:[]}));
      const code=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
      const nt={id:uid(),created:new Date().toISOString(),name:fd.get('name').trim(),location:fd.get('location').trim(),start:s,end:en,budget:+fd.get('budget')||0,bg:fd.get('bg')||'bg-alps',dim:.55,code,creator:meM.id,members:[meM,...fr],places:[],plan:[],expenses:[],payments:[],checklist:[],memories:[]};
      S.trips.unshift(nt);S.cur=nt.id;S.me=meM.id;S.view='home';closeModal();render();toast('สร้างทริปแล้ว ส่งรหัส '+code+' ให้เพื่อนได้เลย');break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.lightbox'))$('.lightbox').remove();else if(!$('#present').hidden)endPresent();else closeModal()}});
addEventListener('scroll',()=>$('#top').classList.toggle('scrolled',scrollY>20),{passive:true});
addEventListener('resize',()=>{if(S.view==='home'){railI=0;moveRail(0)}});

/* ================= presentation ================= */
let pIdx=0,pSlides=[];
function buildSlides(t){
  const sl=[];const days=nDays(t);const ranked=[...t.places].sort((a,b)=>b.votes.length-a.votes.length);
  const sp=spent(t),st=settlements(t),bal=balances(t);
  const R=(i)=>`class="rv" style="--i:${i}"`;
  sl.push({bg:t.bg,html:`<div><div class="kick" ${R(0)}><span class="dash"></span>${esc(t.location)}</div><h1 class="ptitle" ${R(1)}>${esc(t.name)}</h1>
    <p ${R(2)} style="font:500 clamp(16px,2vw,24px) var(--f-head);color:var(--muted);margin:22px 0">${dWeek(t.start)} – ${dWeek(t.end)} · ${days} วัน</p>
    <div class="stack" ${R(3)}>${t.members.map(m=>avatar(m,'lg',m.id===t.creator)).join('')}</div></div>`});
  sl.push({bg:t.bg,html:`<div><div class="kick" ${R(0)}><span class="dash"></span>ทีมเดินทาง</div><h2 ${R(1)}>${t.members.length} คน 1 ทริป</h2>
    <div class="p-grid">${t.members.map((m,i)=>`<div ${R(i+2)} class="row" style="gap:16px">${avatar(m,'lg',m.id===t.creator)}<div><div style="font:500 22px var(--f-head)">${esc(m.name)}</div><div class="muted">${m.id===t.creator?'ผู้สร้างทริป':'สมาชิก'}</div></div></div>`).join('')}</div></div>`});
  for(let d=0;d<days;d++){
    const items=t.plan.filter(i=>i.day===d).sort((a,b)=>a.time.localeCompare(b.time));
    const firstP=items.map(i=>t.places.find(p=>p.id===i.place)).find(p=>p&&p.img);
    sl.push({bg:firstP?firstP.img:t.bg,html:`<div><div class="kick" ${R(0)}><span class="dash"></span>${dayDate(t,d).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long'})}</div><h2 ${R(1)}>Day ${String(d+1).padStart(2,'0')}</h2>
      <div class="p-list">${items.length?items.map((i,k)=>{const p=t.places.find(x=>x.id===i.place);return `<div class="p-row" ${R(k+2)}><span class="time num">${i.time}</span><div class="img" style="${p?placeImg(p):'background:rgba(255,255,255,.08)'}"></div><div><h4>${esc(i.title)}</h4><div class="muted">${p?esc(p.area):''}${p&&i.note?' · ':''}${esc(i.note)}</div></div></div>`}).join(''):`<p ${R(2)} class="muted" style="font-size:20px">วันว่าง ไปตามใจ</p>`}</div></div>`});
  }
  if(ranked.length)sl.push({bg:ranked[0].img||t.bg,html:`<div><div class="kick" ${R(0)}><span class="dash"></span>ผลโหวตจากเพื่อน</div><h2 ${R(1)}>ที่ที่อยากไปที่สุด</h2>
    <div class="p-cards">${ranked.slice(0,4).map((p,i)=>`<div class="pcard" ${R(i+2)} style="cursor:default"><div class="ph" style="${placeImg(p)}"></div>${placeFallback(p)}<span class="votes chip sun">${ic('heart')} ${p.votes.length}/${t.members.length}</span><div class="cap"><span class="dash"></span><small>${esc(p.area)}</small><b>${esc(p.name)}</b></div></div>`).join('')}</div></div>`});
  sl.push({bg:t.bg,html:`<div><div class="kick" ${R(0)}><span class="dash"></span>งบประมาณ</div><h2 ${R(1)}>Budget</h2>
    <div class="p-grid" style="margin-bottom:30px"><div ${R(2)}><div class="muted">งบทั้งหมด</div><div class="big num">${baht(t.budget)}</div></div><div ${R(3)}><div class="muted">ใช้ไปแล้ว</div><div class="big num" style="color:var(--sun)">${baht(sp)}</div></div><div ${R(4)}><div class="muted">เฉลี่ยต่อคน</div><div class="big num">${baht(Math.round(sp/Math.max(1,t.members.length)))}</div></div></div>
    <div class="bar" ${R(5)} style="height:12px;max-width:900px"><i style="width:${t.budget?Math.min(100,sp/t.budget*100):0}%"></i></div></div>`});
  sl.push({bg:t.bg,html:`<div><div class="kick" ${R(0)}><span class="dash"></span>เคลียร์เงิน</div><h2 ${R(1)}>ใครต้องจ่ายใคร</h2>
    <div class="p-list">${st.length?st.map((s,i)=>`<div ${R(i+2)} class="row" style="gap:16px;font:500 clamp(18px,2.2vw,28px) var(--f-head)">${avatar(M(s.from),'lg')}${esc(M(s.from).name)}<span style="color:var(--sun)">${ic('arrow').replace('class="i ','style="width:30px;height:30px" class="i ')}</span>${avatar(M(s.to),'lg')}${esc(M(s.to).name)}<span class="big num" style="font-size:clamp(36px,4vw,56px);margin-left:auto">${baht(s.amount)}</span></div>`).join(''):`<p ${R(2)} style="font-size:24px">ทุกคนเคลียร์ครบแล้ว ✓</p>`}</div></div>`});
  const ck=t.checklist,ckd=ck.filter(c=>c.done).length;
  if(ck.length)sl.push({bg:t.bg,html:`<div><div class="kick" ${R(0)}><span class="dash"></span>ความพร้อม</div><h2 ${R(1)}>Checklist ${Math.round(ckd/ck.length*100)}%</h2>
    <div class="p-grid">${ck.slice(0,12).map((c,i)=>`<div ${R(i+2)} class="row" style="font-size:18px;gap:12px;flex-wrap:nowrap;color:${c.done?'var(--text)':'var(--muted)'}"><span style="width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;${c.done?'background:var(--sun);color:var(--sun-ink)':'border:1.5px solid var(--line-strong)'}">${c.done?ic('tick').replace('class="i ','style="width:15px;height:15px;stroke-width:3" class="i '):''}</span>${esc(c.text)}</div>`).join('')}</div></div>`});
  const mp=t.memories.filter(m=>m.img);
  if(t.memories.length)sl.push({bg:mp[0]?.img||t.bg,html:`<div><div class="kick" ${R(0)}><span class="dash"></span>ความทรงจำ</div><h2 ${R(1)}>Moments</h2>
    <div class="p-collage">${mp.slice(0,8).map((m,i)=>`<img ${R(i+2)} src="${src(m.img)}" alt="">`).join('')}</div>${t.memories.filter(m=>!m.img).slice(0,2).map((m,i)=>`<p ${R(i+10)} style="font:500 22px var(--f-head);max-width:40ch">${esc(m.text)}</p>`).join('')}</div>`});
  sl.push({bg:t.bg,html:`<div style="text-align:center;justify-self:center"><div class="kick" ${R(0)} style="justify-content:center">${esc(t.location)}</div><h1 class="ptitle" ${R(1)}>Let's go!</h1><p ${R(2)} class="muted" style="font:500 22px var(--f-head)">เที่ยวให้สนุก แล้วกลับมาลงรูปกัน</p></div>`});
  return sl;
}
function startPresent(){
  const t=T();pSlides=buildSlides(t);pIdx=0;
  const P=$('#present');P.hidden=false;P.className='fx-'+(S.fx||'zoom');
  P.innerHTML=pSlides.map((s,i)=>`<section class="slide" data-pos="after"><div class="sbg" style="background:${bgCss(s.bg)} center/cover"></div>${s.html}</section>`).join('')+
  `<button class="icon-btn pclose" data-pact="exit" aria-label="ออกจากโหมดพรีเซนต์">${ic('x')}</button>
  <div class="pbar"><button class="circle" data-pact="prev" aria-label="ก่อนหน้า" style="width:48px;height:48px">${ic('left')}</button><button class="circle" data-pact="next" aria-label="ถัดไป" style="width:48px;height:48px">${ic('right')}</button>
  <div class="rail-line"><i id="pLine"></i></div><select id="pFx" aria-label="เอฟเฟกต์เปลี่ยนสไลด์">${[['zoom','ซูม'],['push','เลื่อน'],['fade','จางหาย'],['cube','หมุน 3D'],['rise','ยกขึ้น']].map(([k,l])=>`<option value="${k}" ${S.fx===k?'selected':''}>${l}</option>`).join('')}</select>
  <button class="icon-btn" data-pact="fs" aria-label="เต็มจอ">${ic('max')}</button><div class="counter num" id="pCount" style="font-size:44px;height:44px"><span>01</span></div></div>`;
  P.style.opacity=0;P.animate([{opacity:0},{opacity:1}],{duration:500,fill:'forwards'});
  requestAnimationFrame(()=>showSlide(0));
}
function showSlide(n){
  pIdx=Math.max(0,Math.min(pSlides.length-1,n));
  $$('#present .slide').forEach((s,i)=>{s.dataset.pos=i<pIdx?'before':i>pIdx?'after':'current';s.classList.toggle('active',i===pIdx)});
  $('#pLine').style.transform=`scaleX(${(pIdx+1)/pSlides.length})`;
  $('#pCount').innerHTML=`<span>${String(pIdx+1).padStart(2,'0')}</span>`;
}
function endPresent(){const P=$('#present');try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}P.animate([{opacity:1},{opacity:0}],{duration:350,fill:'forwards'}).onfinish=()=>{P.hidden=true;P.innerHTML=''}}
$('#present').addEventListener('click',e=>{
  const b=e.target.closest('[data-pact]');
  if(b){const a=b.dataset.pact;if(a==='exit')endPresent();if(a==='prev')showSlide(pIdx-1);if(a==='next')showSlide(pIdx+1);if(a==='fs'){try{document.fullscreenElement?document.exitFullscreen():$('#present').requestFullscreen().catch(()=>toast('เบราว์เซอร์นี้ไม่รองรับเต็มจอ'))}catch(err){}}return}
  if(e.target.closest('select,.pbar'))return;
  showSlide(pIdx+(e.clientX<innerWidth*.3?-1:1));
});
$('#present').addEventListener('change',e=>{if(e.target.id==='pFx'){S.fx=e.target.value;$('#present').className='fx-'+S.fx;save()}});
document.addEventListener('keydown',e=>{if($('#present').hidden)return;if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();showSlide(pIdx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();showSlide(pIdx-1)}});
let tx=0;$('#present').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#present').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){e.preventDefault();showSlide(pIdx+(dx<0?1:-1))}});

render();
connect();
</script>
